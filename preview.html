<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile preview</title><style>:root{color-scheme:dark light}body{margin:0;padding:24px;background:#0d1117;color:#e6edf3;font:15px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:8px}
body.light{background:#fff;color:#1f2328}main{width:100%;max-width:830px}img{display:block;max-width:100%;height:auto;margin:8px 0 28px}h2{font-size:13px;font-weight:500;opacity:.6;margin:0}button{padding:8px 14px;border-radius:8px;border:1px solid #888;background:transparent;color:inherit;cursor:pointer}</style></head>
<body><button onclick="document.body.classList.toggle('light')">Switch light / dark GitHub background</button><main><h2>hero.svg</h2><img src="assets/hero.svg" alt="hero.svg"><h2>about-life.svg</h2><img src="assets/about-life.svg" alt="about-life.svg"><h2>stack.svg</h2><img src="assets/stack.svg" alt="stack.svg"><h2>id-dashboard.svg</h2><img src="assets/id-dashboard.svg" alt="id-dashboard.svg"><h2>connect.svg</h2><img src="assets/connect.svg" alt="connect.svg"></main></body></html>
